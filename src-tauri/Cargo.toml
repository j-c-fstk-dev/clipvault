[package]
name = "clipvault"
version = "0.1.0"
description = "Clipboard manager for Linux with full history, categories and backup"
authors = ["Jorge Cristo <dev.jorge.c@gmail.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/j-c-fstk-dev/clipvault"
edition = "2021"

[lib]
name = "clipvault_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
