[package]
name = "clipvault"
version = "0.2.1"
description = "Clipboard manager for Linux with full history, categories and backup"
authors = ["Jorge Cristo <dev.jorge.c@gmail.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/j-c-fstk-dev/clipvault"
edition = "2021"

[lib]
name = "clipvault_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x11rb = { version = "0.14.0", features = ["xfixes"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.1"
url = "2.5.8"
log = "0.4.34"
env_logger = "0.11.11"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
raw-window-handle = "0.6"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.8.3"
libc = "0.2"
gio = "0.18"
base64 = "0.22"
inotify = "0.11.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
