name: macOS preview

# Builds a test .dmg for Apple Silicon and Intel Macs (ad-hoc signed, not
# notarized) and keeps it as a workflow artifact. Runs when the macOS code
# changes, or by hand from the Actions tab.

on:
  pull_request:
    paths:
      - ".github/workflows/macos-preview.yml"
      - "src-tauri/src/platform/macos/**"
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:

concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Build .dmg
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ClipVault-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
